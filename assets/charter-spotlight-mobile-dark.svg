  <text x="30" y="204" class="sans" font-size="15" fill="#A29EA3">Grades any repository 0–100 on how safely an AI</text><text x="30" y="227" class="sans" font-size="15" fill="#A29EA3">coding agent can work in it — then provides every fix.</text>
  <text x="30" y="273" class="mono" font-size="10" letter-spacing="1" fill="#6F6A72">OFFLINE · DETERMINISTIC · NO LLM IN THE LOOP</text>
