    <line x1="18" y1="300" x2="522" y2="300" stroke="#DEDADF"/><circle cx="24" cy="317" r="4" fill="#45D98A"/><text x="38" y="321" class="mono" font-size="9" letter-spacing=".8" fill="#8A858C">LOCAL SCAN · ACTIONABLE FIXES</text>
