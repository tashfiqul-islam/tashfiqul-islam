    <rect y="24" width="540" height="330" fill="#FFFFFF" stroke="#DEDADF"/>
    <g class="mono" font-size="10" fill="#5F5B62"><text x="18" y="61">AGENT CONTEXT</text><text x="18" y="115">MCP SAFETY</text><text x="18" y="169">REPRODUCIBILITY</text><text x="18" y="223">CI POSTURE</text><text x="18" y="277">GOVERNANCE</text></g>
