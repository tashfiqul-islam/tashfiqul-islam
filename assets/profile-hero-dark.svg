<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Tashfiq Islam — technical product leader</title>
  <desc id="desc">Technical product leader working across developer platforms, APIs, AI agents, and open source. Based in Dhaka with more than seven years in technology and five years in product.</desc>
  <style>
    .display{font-family:"Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-weight:800;letter-spacing:-2px}
    .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  </style>
  <rect width="1200" height="430" fill="#0D0A0C"/>
  <rect x=".5" y=".5" width="1199" height="429" fill="none" stroke="#302B32"/>
  <circle cx="46" cy="42" r="4" fill="#58A6FF"/>
  <text x="60" y="47" class="mono" font-size="12" font-weight="700" letter-spacing="2" fill="#6F6A72">TASHFIQUL ISLAM / DHAKA</text>
  <text x="1140" y="47" text-anchor="end" class="mono" font-size="12" letter-spacing="1.5" fill="#6F6A72">PRODUCT · PLATFORM · OPEN SOURCE</text>
  <line x1="800" y1="78" x2="800" y2="330" stroke="#302B32"/>
  <g class="display" font-size="50" fill="#F2F2EF">
    <text x="60" y="126">Technical product leader</text>
    <text x="60" y="190">building <tspan fill="#58A6FF">developer platforms,</tspan></text>
    <text x="60" y="254">APIs, and useful AI tools.</text>
  </g>
  <text x="60" y="296" class="sans" font-size="15" fill="#A29EA3">I turn technical infrastructure into products people can understand, adopt, and trust.</text>
  <g transform="translate(838 102)">
    <text class="mono" font-size="11" font-weight="700" letter-spacing="1.8" fill="#58A6FF">CURRENT SIGNAL</text>
    <text y="43" class="sans" font-size="19" font-weight="700" fill="#F2F2EF">7+ years in technology</text>
    <text y="76" class="sans" font-size="19" font-weight="700" fill="#F2F2EF">5+ years in product</text>
    <line y1="105" x2="302" y2="105" stroke="#302B32"/>
    <text y="141" class="mono" font-size="12" letter-spacing="1.4" fill="#6F6A72">NOW</text>
    <text y="171" class="sans" font-size="14" fill="#A29EA3">Integrations · developer experience</text>
    <text y="198" class="sans" font-size="14" fill="#A29EA3">AI-agent readiness · automation</text>
  </g>
  <line x1="0" y1="340" x2="1200" y2="340" stroke="#302B32"/>
  <g class="mono" font-size="11" font-weight="700" letter-spacing="1.3">
    <text x="60" y="374" fill="#6F6A72">01 / PRODUCT SYSTEMS</text>
    <text x="355" y="374" fill="#6F6A72">02 / DEVELOPER PLATFORMS</text>
    <text x="700" y="374" fill="#6F6A72">03 / AI AGENTS</text>
    <text x="955" y="374" fill="#6F6A72">04 / OPEN SOURCE</text>
  </g>
  <g fill="#58A6FF"><rect x="60" y="394" width="120" height="3"/><rect x="355" y="394" width="120" height="3"/><rect x="700" y="394" width="120" height="3"/><rect x="955" y="394" width="120" height="3"/></g>
</svg>