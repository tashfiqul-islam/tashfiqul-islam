  <title id="title">Tashfiq Islam — technical product leader</title>
  <desc id="desc">Technical product leader working across developer platforms, APIs, AI agents, and open source. Based in Dhaka with more than seven years in technology and five years in product.</desc>
  <style>.display{font-family:"Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-weight:800;letter-spacing:-1.6px}.sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}</style>
