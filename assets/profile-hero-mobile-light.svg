  <text x="28" y="416" class="sans" font-size="20" font-weight="700" fill="#111113">7+ years in technology</text><text x="28" y="448" class="sans" font-size="20" font-weight="700" fill="#111113">5+ years in product</text>
  <text x="28" y="484" class="sans" font-size="14" fill="#5F5B62">Integrations · developer experience</text><text x="28" y="507" class="sans" font-size="14" fill="#5F5B62">AI-agent readiness · automation</text>
