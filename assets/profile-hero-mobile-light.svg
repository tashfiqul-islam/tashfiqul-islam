  <text x="28" y="280" class="sans" font-size="15" fill="#5F5B62">I turn technical infrastructure into products people</text><text x="28" y="303" class="sans" font-size="15" fill="#5F5B62">can understand, adopt, and trust.</text>
  <line x1="0" y1="340" x2="600" y2="340" stroke="#DEDADF"/>
